name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.1
      - uses: haskell-actions/setup@v2.12.1
        with:
          ghc-version: '9.12'
      - run: HSPEC_OPTIONS=--color cabal test
